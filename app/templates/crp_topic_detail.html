{% extends "base.html" %}

{% block title %}主题详情 - Deepin 自动打包工具{% endblock %}

{% block content %}
<!-- 主内容区域 -->
<div id="mainContent">
    <div class="mb-4">
        <a href="{{ url_for('crp.topics') }}" class="btn btn-outline-secondary btn-sm mb-3">
            <i class="bi bi-arrow-left"></i> 返回主题列表
        </a>
        
        <div class="topic-header" id="topicHeader">
            <!-- 加载中显示 -->
            <div class="loading-inline">
                <div class="spinner-border text-light me-2" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <span class="text-white">正在加载主题信息...</span>
            </div>
        </div>
    </div>

    <div id="releasesContainer">
        <!-- 加载中显示 -->
        <div class="text-center py-5 loading-inline">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted">正在加载包列表...</p>
        </div>
    </div>
</div>

<style>
.topic-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
    margin-bottom: 2rem;
}

.topic-header-content h2 {
    color: white;
    font-weight: 700;
}

.topic-header-content p {
    color: rgba(255, 255, 255, 0.9);
    font-size: 1.1rem;
    margin-bottom: 0;
}

.topic-meta {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
}

.meta-badge {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    color: white;
    padding: 0.375rem 0.875rem;
    border-radius: 8px;
    font-size: 0.875rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
}

/* 现代化表格样式 */
.table-container {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    overflow: hidden;
}

.modern-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.95rem;
}

.modern-table thead {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.modern-table thead th {
    padding: 1rem;
    text-align: left;
    font-weight: 600;
    font-size: 0.875rem;
    letter-spacing: 0.5px;
    border: none;
    white-space: nowrap;
}

.modern-table thead th i {
    margin-right: 0.5rem;
    opacity: 0.9;
}

.modern-table tbody tr {
    border-bottom: 1px solid #f0f0f0;
    transition: all 0.2s ease;
}

.modern-table tbody tr:hover {
    background: #f8f9fe;
    transform: scale(1.01);
    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
}

.modern-table tbody tr:last-child {
    border-bottom: none;
}

.modern-table tbody td {
    padding: 1rem;
    vertical-align: middle;
    border: none;
}

.package-cell strong {
    color: #2c3e50;
    font-size: 1rem;
}

.package-cell small {
    font-size: 0.85rem;
    margin-top: 0.25rem;
}

.badge-modern {
    padding: 0.375rem 0.75rem;
    border-radius: 6px;
    font-weight: 500;
    font-size: 0.875rem;
    display: inline-block;
}

.badge-branch {
    background: #e3f2fd;
    color: #1976d2;
    border: 1px solid #bbdefb;
}

.badge-tag {
    background: #f3e5f5;
    color: #7b1fa2;
    border: 1px solid #e1bee7;
}

.badge-arch {
    background: #e8f5e9;
    color: #388e3c;
    border: 1px solid #c8e6c9;
}

/* 架构状态按钮 */
.arch-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 0.375rem;
}

.arch-btn {
    padding: 0.375rem 0.75rem;
    border-radius: 6px;
    font-size: 0.875rem;
    font-weight: 500;
    border: none;
    cursor: default;
    transition: all 0.2s ease;
    min-width: 70px;
    text-align: center;
    position: relative;
}

.arch-btn.loading {
    background: #e2e3e5;
    color: #6c757d;
}

.arch-btn.failed {
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    color: white;
    cursor: pointer;
}

.arch-btn.failed:hover {
    background: linear-gradient(135deg, #ff5252, #e64a64);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(238, 90, 111, 0.4);
}

.arch-btn.build-ok {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
}

.arch-btn.building {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    animation: pulse 2s infinite;
}

.arch-btn.other {
    background: #f3f4f6;
    color: #6b7280;
    border: 1px solid #d1d5db;
}

@keyframes pulse {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.7;
    }
}

.arch-btn[title] {
    cursor: help;
}

.arch-btn.failed[title] {
    cursor: pointer;
}

.commit-hash {
    background: #f5f5f5;
    color: #616161;
    padding: 0.375rem 0.625rem;
    border-radius: 6px;
    font-family: 'Courier New', monospace;
    font-size: 0.875rem;
    border: 1px solid #e0e0e0;
}

.status-badge {
    padding: 0.5rem 0.875rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.875rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    white-space: nowrap;
}

.status-success {
    background: #d1e7dd;
    color: #0f5132;
    border: 1px solid #badbcc;
}

.status-failed {
    background: #f8d7da;
    color: #842029;
    border: 1px solid #f5c2c7;
}

.status-building {
    background: #cfe2ff;
    color: #084298;
    border: 1px solid #b6d4fe;
}

.status-pending {
    background: #fff3cd;
    color: #856404;
    border: 1px solid #ffecb5;
}

.status-unknown {
    background: #e2e3e5;
    color: #41464b;
    border: 1px solid #d3d3d4;
}

.btn-group {
    display: inline-flex;
    gap: 0.25rem;
}

.btn-info-modern {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border: none;
    padding: 0.5rem 0.875rem;
    border-radius: 6px;
    transition: all 0.2s ease;
    font-weight: 500;
}

.btn-info-modern:hover {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    color: white;
}

.btn-warning-modern {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: white;
    border: none;
    padding: 0.5rem 0.875rem;
    border-radius: 6px;
    transition: all 0.2s ease;
    font-weight: 500;
}

.btn-warning-modern:hover {
    background: linear-gradient(135deg, #d97706, #b45309);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
    color: white;
}

.btn-danger-modern {
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    color: white;
    border: none;
    padding: 0.5rem 0.875rem;
    border-radius: 6px;
    transition: all 0.2s ease;
    font-weight: 500;
}

.btn-danger-modern:hover {
    background: linear-gradient(135deg, #ff5252, #e64a64);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(238, 90, 111, 0.3);
    color: white;
}

.spinner-border-sm {
    width: 0.875rem;
    height: 0.875rem;
    border-width: 0.15em;
}

.loading-inline {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
}

/* 仓库地址显示区域 */
.repo-urls-section {
    background: rgba(255, 255, 255, 0.15);

}

.repo-urls-section h5 {

}

.repo-urls-textarea {

    background: rgba(255, 255, 255, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;

}

.repo-actions {
    display: flex;

}

.btn-copy-repo {
    background: rgba(255, 255, 255, 0.9);
    color: #667eea;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-size: 0.875rem;
    font-weight: 500;
    transition: all 0.2s ease;

}

.btn-copy-repo:hover {
    background: white;

    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
}

.btn-workflow {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);

    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-size: 0.875rem;
    font-weight: 500;
    transition: all 0.2s ease;

}

.btn-workflow:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
}

.loading-repos {

}

/* 响应式优化 */

    }

    }

</style>

<script>
const topicId = {{ topic_id }};

// HTML 转义，避免成员账号破坏页面
function escapeHtml(str) {
    return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 页面加载时获取数据
document.addEventListener('DOMContentLoaded', function() {
    loadTopicDetail();
});

// 加载主题详情
async function loadTopicDetail() {
    try {
        const response = await fetch(`/api/topics/${topicId}/detail`);
        const result = await response.json();
        
        if (result.success && result.data) {
            renderTopicHeader(result.data.topic);
            renderReleases(result.data.releases);
        } else {
            throw new Error(result.message || '加载数据失败');
        }
    } catch (error) {
        console.error('加载主题详情失败:', error);
        document.getElementById('topicHeader').innerHTML = `
            <div class="text-center py-3">
                <i class="bi bi-exclamation-circle text-white" style="font-size: 3rem;"></i>
                <p class="text-white mt-2">加载失败: ${error.message}</p>
            </div>
        `;
        document.getElementById('releasesContainer').innerHTML = `
            <div class="text-center py-5">
                <i class="bi bi-exclamation-circle text-danger" style="font-size: 4rem;"></i>
                <p class="mt-3 text-muted">加载失败: ${error.message}</p>
                <button class="btn btn-primary" onclick="location.reload()">
                    <i class="bi bi-arrow-clockwise me-1"></i>重新加载
                </button>
            </div>
        `;
    }
}

// 渲染主题头部信息
function renderTopicHeader(topic) {
    const headerHTML = `
        <div class="topic-header-content">
            <h2 class="mb-2">
                <i class="bi bi-layers-fill text-white me-2"></i>${topic.name}
            </h2>
            <p class="text-white-50 mb-3">${topic.description || '无描述'}</p>
            <div class="topic-meta">
                <span class="meta-badge">
                    <i class="bi bi-calendar3"></i> ${topic.create_time}
                </span>
                <span class="meta-badge">
                    <i class="bi bi-person-fill"></i> ${topic.creator_name}
                </span>
            </div>
            
            <!-- 仓库地址显示区域 -->
            <div class="repo-urls-section" id="repoUrlsSection">
                <h5>
                    <i class="bi bi-box-seam"></i>
                    仓库地址
                </h5>
                <div class="loading-repos">
                    <span class="spinner-border spinner-border-sm me-2"></span>
                    正在加载仓库地址...
                </div>
            </div>

            <!-- 主题成员管理区域 -->
            <div class="repo-urls-section" id="membersSection">
                <h5>
                    <i class="bi bi-people-fill"></i>
                    主题成员
                </h5>
                <div class="loading-repos">
                    <span class="spinner-border spinner-border-sm me-2"></span>
                    正在加载成员...
                </div>
            </div>
        </div>
    `;
    document.getElementById('topicHeader').innerHTML = headerHTML;
    
    // 加载仓库地址
    loadRepoUrls(topic.id);
    // 加载主题成员
    loadMembers(topic.id);
}

// 加载仓库地址
async function loadRepoUrls(topicId) {
    const section = document.getElementById('repoUrlsSection');
    
    try {
        // 首先获取配置中的branchID
        const configResponse = await fetch('/config/api/config');
        const configResult = await configResponse.json();
        
        if (!configResult.success || !configResult.data.crp_branch_id) {
            throw new Error('未配置CRP分支ID，请先在配置页面设置');
        }
        
        const branchID = configResult.data.crp_branch_id;
        const branchName = configResult.data.crp_branch_name || ('分支 ' + branchID);
        
        // 调用CRP API获取仓库地址
        const response = await fetch('https://crp.uniontech.com/api/topic_urls', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                branchID: branchID,
                topicID: topicId
            })
        });
        
        const data = await response.json();
        
        if (data.RepoUrls && data.RepoUrls.length > 0) {
            // 格式化仓库地址：每个地址添加前缀和后缀
            const formattedUrls = data.RepoUrls.map(url => 
                `deb [trusted=yes] ${url} unstable main`
            ).join('\n');
            
            section.innerHTML = `
                <h5>
                    <i class="bi bi-box-seam"></i>
                    仓库地址
                </h5>
                <textarea class="repo-urls-textarea" readonly>${formattedUrls}</textarea>
                <div class="repo-actions">
                    <button class="btn-copy-repo" onclick="copyRepoUrls()">
                        <i class="bi bi-clipboard"></i> 复制仓库地址
                    </button>
                    <button class="btn-workflow" onclick="enterWorkflow()" title="功能开发中">
                        <i class="bi bi-arrow-right-circle"></i> 进入CRP工作流
                    </button>
                </div>
            `;
        } else {
            section.innerHTML = `
                <h5>
                    <i class="bi bi-box-seam"></i>
                    仓库地址
                </h5>
                <div style="color: rgba(255, 255, 255, 0.8); font-size: 0.875rem;">
                    <i class="bi bi-info-circle me-1"></i>
                    暂无仓库地址
                </div>
                <div class="repo-actions" style="margin-top: 0.75rem;">
                    <button class="btn-workflow" onclick="enterWorkflow()" title="功能开发中">
                        <i class="bi bi-arrow-right-circle"></i> 进入CRP工作流
                    </button>
                </div>
            `;
        }
    } catch (error) {
        console.error('加载仓库地址失败:', error);
        section.innerHTML = `
            <h5>
                <i class="bi bi-box-seam"></i>
                仓库地址
            </h5>
            <div style="color: rgba(255, 255, 255, 0.8); font-size: 0.875rem;">
                <i class="bi bi-exclamation-triangle me-1"></i>
                ${error.message}
            </div>
            <div class="repo-actions" style="margin-top: 0.75rem;">
                <button class="btn-workflow" onclick="enterWorkflow()" title="功能开发中">
                    <i class="bi bi-arrow-right-circle"></i> 进入CRP工作流
                </button>
            </div>
        `;
    }
}

// 加载主题成员
async function loadMembers(topicId) {
    const section = document.getElementById('membersSection');
    try {
        const response = await fetch(`/api/topics/${topicId}/members`);
        const result = await response.json();
        if (!result.success) {
            section.innerHTML = `<h5><i class="bi bi-people-fill"></i> 主题成员</h5><div style="color:rgba(255,255,255,.8);font-size:.875rem;">${escapeHtml(result.message || '加载失败')}</div>`;
            return;
        }
        const owners = result.data.owners || [];
        const members = result.data.members || [];
        const chip = (name, role) => `
            <span class="badge rounded-pill me-2 mb-2" style="background:rgba(255,255,255,.18);color:#fff;padding:.4rem .7rem;">
                <i class="bi bi-person${role === 'owner' ? '-fill' : ''} me-1"></i>${escapeHtml(name)}
                <span class="badge bg-light text-dark ms-1" style="font-size:.65rem;">${role === 'owner' ? '负责人' : '成员'}</span>
                <a href="javascript:void(0)" onclick="removeTopicMember('${escapeHtml(name)}','${role}')" title="移除" style="color:#fff;text-decoration:none;margin-left:.3rem;">&times;</a>
            </span>`;
        let chips = owners.map(n => chip(n, 'owner')).join('') + members.map(n => chip(n, 'member')).join('');
        if (!chips) chips = '<span style="color:rgba(255,255,255,.7);font-size:.85rem;">暂无成员</span>';
        section.innerHTML = `
            <h5><i class="bi bi-people-fill"></i> 主题成员</h5>
            <div class="mb-2">${chips}</div>
            <div class="d-flex flex-wrap gap-2 align-items-center">
                <input type="text" id="topicMemberInput" class="form-control form-control-sm" placeholder="输入 LDAP 账号" style="max-width:200px;">
                <select id="topicMemberRole" class="form-select form-select-sm" style="max-width:120px;">
                    <option value="member">成员</option>
                    <option value="owner">负责人</option>
                </select>
                <button class="btn btn-sm btn-light" onclick="addTopicMember()"><i class="bi bi-plus-lg"></i> 添加</button>
            </div>
            <small style="color:rgba(255,255,255,.6);">输入账号后点击添加；负责人可管理主题，成员仅可查看/使用</small>
        `;
    } catch (error) {
        section.innerHTML = `<h5><i class="bi bi-people-fill"></i> 主题成员</h5><div style="color:rgba(255,255,255,.8);font-size:.875rem;">加载失败: ${escapeHtml(error.message)}</div>`;
    }
}

// 添加主题成员
async function addTopicMember() {
    const input = document.getElementById('topicMemberInput');
    const roleSel = document.getElementById('topicMemberRole');
    const acc = (input.value || '').trim();
    if (!acc) { showToast('请输入 LDAP 账号', 'warning'); return; }
    const role = roleSel.value;
    const key = role === 'owner' ? 'add_owners' : 'add_members';
    try {
        const resp = await fetch(`/api/topics/${topicId}/members`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ [key]: [acc] })
        });

// 加载架构状态
async function loadArchStatus(buildId) {
    const container = document.getElementById(`arch-${buildId}`);
    if (!container) return;
    
    try {
        const response = await fetch('https://shuttle.uniontech.com/api/shuttle/task/list', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                params: { taskid: buildId.toString() },
                pageSize: 20,
                current: 1
            })
        });
        
        const data = await response.json();
        
        if (data.tasks && data.tasks.length > 0 && data.tasks[0].jobs) {
            const jobs = data.tasks[0].jobs;
            let buttonsHTML = '';
            
            jobs.forEach(job => {
                const status = job.status || 'UNKNOWN';
                let btnClass = 'other';
                let clickable = false;
                
                if (status === 'FAILED') {
                    btnClass = 'failed';
                    clickable = true;
                } else if (status === 'BUILD_OK' || status === 'UPLOAD_OK') {
                    btnClass = 'build-ok';
                } else if (status.includes('BUILD') && !status.includes('OK')) {
                    btnClass = 'building';
                }

                const onclick = clickable ? `onclick="viewJobLog(${job.id}, '${job.arch}', ${buildId}, '${status}')"` : '';
                const title = clickable ? `${job.arch}: ${status} — 点击查看日志` : `${job.arch}: ${status}`;
                buttonsHTML += `
                    <button class="arch-btn ${btnClass}"
                            title="${title}"
                            ${onclick}>
                        ${job.arch}
                        ${clickable ? '<span style="font-size:0.65rem;margin-left:2px;">📋</span>' : ''}
                    </button>
                `;
            });
            
            container.innerHTML = buttonsHTML;
        } else {
            container.innerHTML = '<span class="badge-modern badge-arch">无架构信息</span>';
        }
    } catch (error) {
        console.error('加载架构状态失败:', error);
        container.innerHTML = '<span class="badge-modern badge-arch">加载失败</span>';
    }
}

// 根据构建状态返回对应的HTML
function getStatusBadge(buildState) {
    const statusMap = {
        'SUCCESS': '<span class="status-badge status-success"><i class="bi bi-check-circle-fill"></i> 成功</span>',
        'FAILED': '<span class="status-badge status-failed"><i class="bi bi-x-circle-fill"></i> 失败</span>',

        'PENDING': '<span class="status-badge status-pending"><i class="bi bi-clock-fill"></i> 待构建</span>'
    };
    
    return statusMap[buildState] || `<span class="status-badge status-unknown"><i class="bi bi-question-circle-fill"></i> ${buildState}</span>`;
}

// 重试构建 - 重试所有失败的架构
async function retryBuild(releaseId, projectName, buildId) {
    const confirmed = await customConfirm(
        `确定要重试 ${projectName} 所有失败的架构吗？`,
        '重试构建',
        'arrow-clockwise',
        'warning'
    );
    
    if (!confirmed) return;
    
    try {
        // 获取维护者姓名作为username
        const configResponse = await fetch('/config/api/config');
        const configResult = await configResponse.json();
        
        if (!configResult.success || !configResult.data.maintainer_name) {
            showToast('未配置维护者姓名，请先在配置页面设置', 'error');
            return;
        }
        
        const username = configResult.data.maintainer_name;
        
        // 获取架构状态
        const statusResponse = await fetch('https://shuttle.uniontech.com/api/shuttle/task/list', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                params: { taskid: buildId.toString() },
                pageSize: 20,
                current: 1
            })
        });
        
        const statusData = await statusResponse.json();
        
        if (!statusData.tasks || !statusData.tasks[0] || !statusData.tasks[0].jobs) {
            showToast('无法获取架构状态', 'error');
            return;
        }
        
        const jobs = statusData.tasks[0].jobs;
        const failedJobs = jobs.filter(job => job.status === 'FAILED');
        
        if (failedJobs.length === 0) {
            showToast('没有失败的架构需要重试', 'info');
            return;
        }
        
        showToast(`正在重试 ${failedJobs.length} 个失败的架构...`, 'info');
        
        // 重试所有失败的架构
        let successCount = 0;
        let failCount = 0;
        
        for (const job of failedJobs) {
            try {
                const rebuildResponse = await fetch('https://shuttle.uniontech.com/api/shuttle/job/rebuild', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        jobid: job.id,
                        username: username
                    })
                });
                
                const rebuildData = await rebuildResponse.json();
                
                if (rebuildData.code === 0) {
                    successCount++;
                } else {
                    failCount++;
                    console.error(`重试 ${job.arch} 失败:`, rebuildData.message);
                }
            } catch (err) {
                failCount++;
                console.error(`重试 ${job.arch} 异常:`, err);
            }
        }
        
        if (successCount === failedJobs.length) {
            showToast(`已成功重试 ${successCount} 个架构`, 'success');
        } else if (successCount > 0) {
            showToast(`重试完成: 成功 ${successCount} 个，失败 ${failCount} 个`, 'warning');
        } else {
            showToast('所有架构重试失败', 'error');
        }
        
        // 重新加载架构状态
        setTimeout(() => {
            loadArchStatus(buildId);
        }, 1000);
        
    } catch (error) {
        console.error('重试构建失败:', error);
        showToast(`重试失败: ${error.message}`, 'error');
    }
}

                '<div class="text-center py-4" style="color: #f87171;">日志获取失败: ' + (result.message || '未知错误') + '</div>';

            '<div class="text-center py-4 text-danger"><i class="bi bi-exclamation-triangle me-2"></i>' + e.message + '</div>';
    }
}

async function runAIAnalysis() {
    if (!currentJobInfo) return;
    const { jobId, arch } = currentJobInfo;

    const resultDiv = document.getElementById('aiAnalysisResult');
    const btn = document.getElementById('logAIAnalyzeBtn');

    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `
        <div style="color: #0dcaf0;" id="aiStreamingHint">
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
            AI 正在分析构建日志...
        </div>
        <div id="aiStreamingContent" style="color:#e2e8f0;font-size:0.875rem;line-height:1.7;"></div>
    `;
    btn.disabled = true;

    const contentDiv = document.getElementById('aiStreamingContent');
    const hintDiv = document.getElementById('aiStreamingHint');
    let fullText = '';

    try {
        const projectName = document.getElementById('topicHeader') ?
            (document.querySelector('.topic-header-content h2') ?
                document.querySelector('.topic-header-content h2').textContent.trim() : '') : '';

        const resp = await fetch('/api/shuttle/log/' + jobId + '/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ arch: arch, project_name: projectName })
        });

        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            resultDiv.innerHTML = '<div style="color:#f87171;">AI 分析失败: ' + (err.message || 'HTTP ' + resp.status) + '</div>';
            return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const data = line.slice(6);
                if (data === '[DONE]') continue;

                try {
                    const parsed = JSON.parse(data);
                    fullText += parsed.c || '';
                } catch {
                    fullText += data;
                }
                contentDiv.textContent = fullText;
            }
        }

        // Streaming complete — render markdown
        hintDiv.style.display = 'none';
        const html = fullText
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n/g, '<br>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/`([^`]+)`/g, '<code style="background:#0f172a;padding:2px 6px;border-radius:4px;">$1</code>');
        contentDiv.innerHTML = '<p>' + html + '</p>';
        resultDiv.scrollIntoView({ behavior: 'smooth' });

    } catch (e) {
        resultDiv.innerHTML = '<div style="color:#f87171;">请求失败: ' + e.message + '</div>';
    } finally {
        btn.disabled = false;
    }
}

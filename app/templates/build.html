{% extends "base.html" %}

{% block title %}打包任务{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <!-- 页面标题和操作按钮 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">
            <i class="bi bi-list-task"></i> 打包任务
        </h2>
        <div class="d-flex gap-2">
            <!-- 状态筛选 -->
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-secondary btn-sm active" onclick="filterTasks('all')">
                    全部
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="filterTasks('running')">
                    <i class="bi bi-play-circle"></i> 进行中
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="filterTasks('success')">
                    <i class="bi bi-check-circle"></i> 成功
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="filterTasks('failed')">
                    <i class="bi bi-x-circle"></i> 失败
                </button>
            </div>
            
            <button class="btn btn-outline-danger" onclick="cleanupCompletedTasks()">
                <i class="bi bi-trash"></i> 清理已完成
            </button>
            
            <button class="btn btn-outline-info" onclick="showUnmergedPRs()">
                <i class="bi bi-git"></i> 未合并PR
            </button>
            
            <button class="btn btn-outline-primary" onclick="refreshTasks()">
                <i class="bi bi-arrow-clockwise"></i> 刷新
            </button>
        </div>
    </div>

    <!-- 任务统计 -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="stat-card stat-total">
                <i class="bi bi-stack"></i>
                <div>
                    <div class="stat-value" id="stat-total">0</div>
                    <div class="stat-label">总任务</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card stat-running">
                <i class="bi bi-play-circle"></i>
                <div>
                    <div class="stat-value" id="stat-running">0</div>
                    <div class="stat-label">进行中</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card stat-success">
                <i class="bi bi-check-circle"></i>
                <div>
                    <div class="stat-value" id="stat-success">0</div>
                    <div class="stat-label">成功</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card stat-failed">
                <i class="bi bi-x-circle"></i>
                <div>
                    <div class="stat-value" id="stat-failed">0</div>
                    <div class="stat-label">失败</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载提示 -->
    <div id="loading" class="text-center py-5" style="display: none;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">加载中...</span>
        </div>
        <p class="mt-3 text-muted">正在加载任务列表...</p>
    </div>

    <!-- 任务列表 -->
    <div id="tasks-container"></div>

    <!-- 空状态 -->
    <div id="empty-state" class="text-center py-5" style="display: none;">
        <i class="bi bi-inbox" style="font-size: 4rem; color: #ccc;"></i>
        <p class="mt-3 text-muted">暂无打包任务</p>
        <p class="text-muted small">打包任务会从提交监控页面创建</p>
    </div>
</div>

<!-- 任务详情模态框 -->
<div class="modal fade" id="taskDetailModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-info-circle me-2"></i>任务详情
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="taskDetailContent">
                <!-- 详情内容动态加载 -->
            </div>
        </div>
    </div>
</div>

<!-- 未合并PR列表模态框 -->
<div class="modal fade" id="unmergedPRModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content pr-modal-content">
            <div class="modal-header pr-modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-git me-2"></i>未合并的 Pull Request
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pr-modal-body">
                <div class="pr-actions mb-3">
                    <button class="btn btn-success btn-copy-all" onclick="copyAllPRs()">
                        <i class="bi bi-clipboard-check"></i> 一键复制所有
                    </button>
                    <span class="copy-feedback"></span>
                </div>
                
                <div id="prLoadingSpinner" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3 text-muted">正在加载 PR 列表...</p>
                </div>
                
                <div id="prListContainer" style="display: none;">
                    <!-- PR列表将在这里动态加载 -->
                </div>
                
                <div id="prEmptyState" class="text-center py-5" style="display: none;">
                    <i class="bi bi-check-circle" style="font-size: 3rem; color: #28a745;"></i>
                    <p class="mt-3 text-muted">🎉 太棒了！当前所有任务的 PR 都已合并</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* 统计卡片 */
.stat-card {
    background: white;
    border-radius: 12px;
    padding: 1.25rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: all 0.3s ease;
}

.stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}

.stat-card i {
    font-size: 2.5rem;
    opacity: 0.9;
}

.stat-value {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 0.25rem;
}

.stat-label {
    font-size: 0.875rem;
    color: #666;
    font-weight: 500;
}

.stat-total i { color: #6c757d; }
.stat-total .stat-value { color: #6c757d; }

.stat-running i { color: #ffc107; }
.stat-running .stat-value { color: #ffc107; }

.stat-success i { color: #28a745; }
.stat-success .stat-value { color: #28a745; }

.stat-failed i { color: #dc3545; }
.stat-failed .stat-value { color: #dc3545; }

/* 任务卡片 */
.task-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 1.5rem;
    overflow: hidden;
    transition: all 0.3s ease;
}

.task-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    transform: translateY(-2px);
}

/* 任务头部 */
.task-header {
    padding: 1.25rem 1.5rem;
    background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
    border-bottom: 2px solid #f0f0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.task-title-section {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex: 1;
}

.task-project-name {
    font-size: 1.25rem;
    font-weight: 600;
    color: #2c3e50;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.task-version {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.875rem;
    font-weight: 500;
}

.task-mode-badge {
    background: #e9ecef;
    color: #495057;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 500;
}

.task-status-section {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.task-status-badge {
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.875rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
}

.status-pending {
    background: #e9ecef;
    color: #495057;
}

.status-running {
    background: #fff3cd;
    color: #856404;
}

.status-success {
    background: #d1e7dd;
    color: #0f5132;
}

.status-failed {
    background: #f8d7da;
    color: #842029;
}

.status-paused {
    background: #d1ecf1;
    color: #0c5460;
}

.status-cancelled {
    background: #e2e3e5;
    color: #41464b;
}

/* 任务主体 */
.task-body {
    padding: 1.5rem;
}

/* 进度条 */
.task-progress-bar {
    height: 8px;
    background: #e9ecef;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 1rem;
}

.task-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
    transition: width 0.5s ease;
    position: relative;
    overflow: hidden;
}

.task-progress-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    right: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 2s infinite;
}

@keyframes shimmer {
    0% {
        transform: translateX(-100%);
    }
    100% {
        transform: translateX(100%);
    }
}

/* PR模态框样式 */
.pr-modal-content {
    border: none;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

.pr-modal-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 1.5rem;
    border: none;
}

.pr-modal-header .modal-title {
    font-weight: 600;
    font-size: 1.25rem;
}

.pr-modal-body {
    padding: 1.5rem;
    max-height: 70vh;
    overflow-y: auto;
}

.pr-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.btn-copy-all {
    font-weight: 600;
    border-radius: 8px;
    padding: 0.6rem 1.5rem;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(40, 167, 69, 0.3);
}

.btn-copy-all:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
}

.copy-feedback {
    color: #28a745;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s ease;
    animation: fadeInOut 2s ease;
}

@keyframes fadeInOut {
    0%, 100% { opacity: 0; }
    20%, 80% { opacity: 1; }
}

.pr-item {
    background: white;
    border: 2px solid #e9ecef;
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    animation: slideInUp 0.4s ease;
}

@keyframes slideInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.pr-item:hover {
    border-color: #667eea;
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.15);
    transform: translateX(4px);
}

.pr-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.pr-item:hover::before {
    opacity: 1;
}

.pr-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.75rem;
}

.pr-title {
    font-size: 1rem;
    font-weight: 600;
    color: #2c3e50;
    margin: 0 0 0.5rem 0;
    flex: 1;
}

.pr-number {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.875rem;
    font-weight: 600;
    white-space: nowrap;
}

.pr-meta {
    display: flex;
    gap: 1rem;
    font-size: 0.875rem;
    color: #6c757d;
    margin-bottom: 0.75rem;
}

.pr-meta-item {
    display: flex;
    align-items: center;
    gap: 0.35rem;
}

.pr-url {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8f9fa;
    padding: 0.75rem;
    border-radius: 8px;
    margin-top: 0.75rem;
}

.pr-link {
    color: #667eea;
    text-decoration: none;
    font-size: 0.875rem;
    font-family: 'Courier New', monospace;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.pr-link:hover {
    text-decoration: underline;
}

.btn-copy-pr {
    background: white;
    border: 1px solid #dee2e6;
    color: #495057;
    padding: 0.375rem 0.75rem;
    border-radius: 6px;
    font-size: 0.875rem;
    transition: all 0.2s ease;
}

.btn-copy-pr:hover {
    background: #667eea;
    color: white;
    border-color: #667eea;
    transform: scale(1.05);
}

.btn-copy-pr.copied {
    background: #28a745;
    color: white;
    border-color: #28a745;
}

.pr-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
}

.pr-status-open {
    background: #fff3cd;
    color: #856404;
}

.task-progress-text {
    font-size: 0.875rem;
    color: #666;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

/* 步骤网格 */
.steps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.step-item {
    background: #f8f9fa;
    border: 2px solid #e9ecef;
    border-radius: 10px;
    padding: 1rem;
    transition: all 0.3s ease;
    position: relative;
}

.step-item.completed {
    background: linear-gradient(135deg, #d1e7dd 0%, #a3d9a5 100%);
    border-color: #28a745;
}

.step-item.running {
    background: linear-gradient(135deg, #fff3cd 0%, #ffe69c 100%);
    border-color: #ffc107;
    animation: pulseStep 2s infinite;
}

.step-item.failed {
    background: linear-gradient(135deg, #f8d7da 0%, #f1aeb5 100%);
    border-color: #dc3545;
}

.step-item.skipped {
    background: #f8f9fa;
    border-color: #dee2e6;
    opacity: 0.6;
}

@keyframes pulseStep {
    0%, 100% {
        box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.4);
    }
    50% {
        box-shadow: 0 0 0 8px rgba(255, 193, 7, 0);
    }
}

.step-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
}

.step-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.875rem;
    font-weight: bold;
    background: white;
    color: #999;
}

.step-item.completed .step-icon {
    background: #28a745;
    color: white;
}

.step-item.running .step-icon {
    background: #ffc107;
    color: white;
}

.step-item.failed .step-icon {
    background: #dc3545;
    color: white;
}

.step-name {
    font-weight: 600;
    font-size: 0.875rem;
    color: #2c3e50;
    flex: 1;
}

.step-time {
    font-size: 0.75rem;
    color: #666;
    margin-top: 0.25rem;
}

.step-log {
    font-size: 0.75rem;
    color: #666;
    margin-top: 0.5rem;
    padding: 0.5rem;
    background: rgba(255,255,255,0.5);
    border-radius: 6px;
    font-family: 'Courier New', monospace;
    white-space: pre-wrap;
    word-break: break-all;
}

.step-item.failed .step-log {
    background: rgba(220, 53, 69, 0.1);
    color: #842029;
    font-weight: 500;
}

/* 打包信息区块 */
.build-info {
    margin: 1rem 0;
    padding: 0.75rem 1rem;
    background: #eef4ff;
    border: 1px solid #cfe0ff;
    border-radius: 8px;
}

.build-info-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    font-weight: 600;
    color: #2563eb;
    margin-bottom: 0.5rem;
}

.build-info-content {
    margin: 0;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    color: #334155;
}

.build-info-content > div {
    white-space: pre-wrap;
    word-break: break-all;
}

.repo-url-value {
    color: #1d4ed8;
}

.btn-refresh-repo {
    background: transparent;
    border: none;
    color: #2563eb;
    cursor: pointer;
    padding: 0.1rem 0.3rem;
    font-size: 0.85rem;
    line-height: 1;
}

.btn-refresh-repo:hover {
    color: #1d4ed8;
}

/* 任务信息 */
.task-meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    padding: 1rem;
    background: #f8f9fa;
    border-radius: 8px;
    margin-bottom: 1rem;
}

.meta-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.875rem;
    color: #666;
}

.meta-item i {
    color: #667eea;
    font-size: 1rem;
}

.meta-item strong {
    color: #2c3e50;
}

/* 错误信息 */
.error-message {
    background: linear-gradient(135deg, #f8d7da 0%, #f5c2c7 100%);
    border: 2px solid #dc3545;
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: start;
    gap: 1rem;
}

.error-message i {
    font-size: 1.5rem;
    color: #dc3545;
    flex-shrink: 0;
}

.error-content {
    flex: 1;
}

.error-title {
    font-weight: 600;
    color: #842029;
    margin-bottom: 0.5rem;
    font-size: 1rem;
}

.error-text {
    color: #842029;
    font-size: 0.875rem;
    line-height: 1.5;
    font-family: 'Courier New', monospace;
    background: rgba(255,255,255,0.5);
    padding: 0.75rem;
    border-radius: 6px;
    margin-top: 0.5rem;
}

/* 任务操作按钮 */
.task-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding-top: 1rem;
    border-top: 1px solid #e9ecef;
}

.task-footer {
    padding: 1rem 1.5rem;
    background: #f8f9fa;
    border-top: 2px solid #e9ecef;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.task-timestamps {
    display: flex;
    gap: 1.5rem;
    font-size: 0.75rem;
    color: #666;
}

.timestamp-item {
    display: flex;
    align-items: center;
    gap: 0.25rem;
}

/* 动画效果 */
.spinner-dot {
    animation: spin 1s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* 响应式 */
@media (max-width: 768px) {
    .steps-grid {
        grid-template-columns: 1fr;
    }
    
    .task-meta {
        grid-template-columns: 1fr;
    }
    
    .task-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
    }
    
    .task-actions {
        width: 100%;
    }
}

/* Shuttle 构建进度区块 */
.shuttle-block {
    margin-top: 0.75rem;
    padding-top: 0.6rem;
    border-top: 1px dashed #e0e0e0;
}
.shuttle-block-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.4rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: #555;
}
.shuttle-state-text {
    font-weight: 500;
    color: #764ba2;
}
.shuttle-jobs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 0.5rem;
}
.shuttle-job-badge {
    display: inline-flex;
    align-items: center;
    padding: 0.15rem 0.5rem;
    border-radius: 1rem;
    font-size: 0.72rem;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    background: #6c757d;
    transition: transform 0.15s ease;
}
.shuttle-job-badge:hover { transform: translateY(-1px); color: #fff; }
.shuttle-job-ok { background: #198754; }
.shuttle-job-builtinok { background: #0d6efd; }
.shuttle-job-failed { background: #dc3545; }
.shuttle-job-building {
    background: #fd7e14;
    background-image: linear-gradient(90deg, #fd7e14 0%, #ffb347 50%, #fd7e14 100%);
    background-size: 200% 100%;
    animation: shuttle-stripes 1.2s linear infinite;
}
@keyframes shuttle-stripes {
    0% { background-position: 0% 0; }
    100% { background-position: -200% 0; }
}
.shuttle-job-other { background: #6c757d; }
.shuttle-link { margin-top: 0.25rem; }
</style>

<script>
let currentFilter = 'all';
let currentTasks = []; // 保存当前任务列表

// 页面加载时获取任务列表
document.addEventListener('DOMContentLoaded', function() {
    loadTasks();
    
    // 每5秒自动刷新
    setInterval(loadTasks, 5000);
});

// 加载任务列表
async function loadTasks() {
    const container = document.getElementById('tasks-container');
    const emptyState = document.getElementById('empty-state');
    
    try {
        const response = await fetch('/api/tasks');
        const result = await response.json();

        if (!result.success) {
            return;
        }

        const tasks = result.data || [];
        currentTasks = tasks; // 保存任务列表
        
        // 更新统计
        updateStats(tasks);

        if (tasks.length === 0) {
            container.innerHTML = '';
            emptyState.style.display = 'block';
            return;
        }

        emptyState.style.display = 'none';
        
        // 过滤任务
        const filteredTasks = currentFilter === 'all' 
            ? tasks 
            : tasks.filter(t => t.status === currentFilter);
        
        // 渲染任务列表
        container.innerHTML = '';
        filteredTasks.forEach(task => {
            const card = createTaskCard(task);
            container.appendChild(card);
            // 按需拉取 CRP 子仓库地址（仅 CRP 打包模式）
            ensureRepoUrl(task);
            // 按需拉取 Shuttle 构建进度（仅 CRP 打包模式）
            ensureShuttleStatus(task);
        });

    } catch (err) {
        console.error('加载任务列表失败:', err);
    }
}

// 更新统计数据
function updateStats(tasks) {
    const stats = {
        total: tasks.length,
        running: tasks.filter(t => t.status === 'running').length,
        success: tasks.filter(t => t.status === 'success').length,
        failed: tasks.filter(t => t.status === 'failed').length
    };
    
    document.getElementById('stat-total').textContent = stats.total;
    document.getElementById('stat-running').textContent = stats.running;
    document.getElementById('stat-success').textContent = stats.success;
    document.getElementById('stat-failed').textContent = stats.failed;
}

// 创建任务卡片
function createTaskCard(task) {
    const card = document.createElement('div');
    card.className = 'task-card';
    card.dataset.taskId = task.id;
    card.dataset.status = task.status;

    // 计算进度百分比
    const completedSteps = task.steps.filter(s => s.status === 'completed').length;
    let progressPercent = Math.round((completedSteps / task.steps.length) * 100);
    // “监控打包”步骤运行中时，用 Shuttle 各架构完成度细化进度，上传完成前不显示 100%
    const monitorStep = task.steps.find(s => s.step_name === '监控打包');
    if (monitorStep && monitorStep.status === 'running' && shuttleCache[task.id] && (shuttleCache[task.id].jobs || []).length) {
        const jobs = shuttleCache[task.id].jobs;
        const doneArch = jobs.filter(j => (j.status || '').toUpperCase() === 'UPLOAD_OK').length;
        const base = Math.round((completedSteps / task.steps.length) * 100);
        progressPercent = Math.min(99, base + Math.round((100 - base) * (doneArch / jobs.length)));
    }

    // 状态配置
    const statusConfig = {
        pending: { icon: 'bi-clock', text: '等待中', color: 'pending' },
        running: { icon: 'bi-play-circle-fill', text: '进行中', color: 'running' },
        paused: { icon: 'bi-pause-circle', text: '已暂停', color: 'paused' },
        success: { icon: 'bi-check-circle-fill', text: '成功', color: 'success' },
        failed: { icon: 'bi-x-circle-fill', text: '失败', color: 'failed' },
        cancelled: { icon: 'bi-slash-circle', text: '已取消', color: 'cancelled' }
    };

    const status = statusConfig[task.status] || statusConfig.pending;
    
    // 模式显示名称
    const modeNames = {
        'normal': '正常打包',
        'changelog_only': '仅Changelog',
        'crp_only': '仅CRP打包'
    };

    card.innerHTML = `
        <!-- 任务头部 -->
        <div class="task-header">
            <div class="task-title-section">
                <h3 class="task-project-name">
                    <i class="bi bi-box-seam"></i>
                    ${task.project_name}
                </h3>
                <span class="task-version">v${task.version}</span>
                <span class="task-mode-badge">${modeNames[task.mode] || task.mode}</span>
            </div>
            <div class="task-status-section">
                <span class="task-status-badge status-${status.color}">
                    <i class="bi ${status.icon}"></i>
                    ${status.text}
                </span>
                <span class="text-muted small">#${task.id}</span>
            </div>
        </div>

        <!-- 任务主体 -->
        <div class="task-body">
            ${task.error ? createErrorSection(task.error) : ''}
            
            <!-- 进度条 -->
            <div class="task-progress-text">
                <i class="bi bi-graph-up"></i>
                <span>执行进度: ${progressPercent}% (${completedSteps}/${task.steps.length})</span>
            </div>
            <div class="task-progress-bar">
                <div class="task-progress-fill" style="width: ${progressPercent}%"></div>
            </div>

            <!-- 步骤网格 -->
            <div class="steps-grid">
                ${task.steps.map((step, index) => createStepItem(step, index)).join('')}
            </div>

            ${createBuildInfoSection(task)}

            <!-- 任务元信息 -->
            <div class="task-meta">
                <div class="meta-item">
                    <i class="bi bi-calendar-plus"></i>
                    <span>创建: ${task.created_at}</span>
                </div>
                ${task.started_at ? `
                <div class="meta-item">
                    <i class="bi bi-play-fill"></i>
                    <span>开始: ${task.started_at}</span>
                </div>
                ` : ''}
                ${task.completed_at ? `
                <div class="meta-item">
                    <i class="bi bi-check-lg"></i>
                    <span>完成: ${task.completed_at}</span>
                </div>
                ` : ''}
                <div class="meta-item">
                    <i class="bi bi-arrow-clockwise"></i>
                    <span>更新: ${task.updated_at}</span>
                </div>
                ${task.architectures ? `
                <div class="meta-item">
                    <i class="bi bi-cpu"></i>
                    <span>架构: ${task.architectures.join(', ')}</span>
                </div>
                ` : ''}
                ${task.github_pr_url ? `
                <div class="meta-item">
                    <i class="bi bi-github"></i>
                    <a href="${task.github_pr_url}" target="_blank" class="text-decoration-none">
                        PR #${task.github_pr_number}
                    </a>
                </div>
                ` : ''}
                ${task.crp_build_url ? `
                <div class="meta-item">
                    <i class="bi bi-box"></i>
                    <a href="${task.crp_build_url}" target="_blank" class="text-decoration-none">
                        CRP构建
                    </a>
                </div>
                ` : ''}
                ${task.crp_topic_id ? `
                <div class="meta-item">
                    <i class="bi bi-layers"></i>
                    <a href="/topics/${task.crp_topic_id}" class="text-decoration-none" title="查看 CRP 主题详情">
                        CRP主题
                    </a>
                </div>
                ` : ''}
                ${task.crp_topic_id ? `
                <div class="meta-item">
                    <i class="bi bi-diagram-3"></i>
                    <a href="https://crp.uniontech.com/#/workflow/workflow?id=${task.crp_topic_id}" target="_blank" class="text-decoration-none" title="跳转到 CRP 工作流">
                        工作流
                    </a>
                </div>
                ` : ''}
            </div>

            <!-- 操作按钮 -->
            <div class="task-actions">
                ${createActionButtons(task)}
            </div>
        </div>
    `;

    return card;
}

// 创建错误信息区域
function createErrorSection(error) {
    return `
        <div class="error-message">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <div class="error-content">
                <div class="error-title">任务执行失败</div>
                <div class="error-text">${error}</div>
            </div>
        </div>
    `;
}

// 创建步骤项
function createStepItem(step, index) {
    const statusClass = step.status || 'pending';
    const iconMap = {
        pending: 'bi-hourglass',
        running: 'bi-arrow-repeat spinner-dot',
        completed: 'bi-check-lg',
        failed: 'bi-x-lg',
        skipped: 'bi-dash-lg'
    };

    const statusText = {
        pending: '等待',
        running: '执行中',
        completed: '完成',
        failed: '失败',
        skipped: '跳过'
    };

    return `
        <div class="step-item ${statusClass}">
            <div class="step-header">
                <div class="step-icon">
                    <i class="bi ${iconMap[statusClass] || iconMap.pending}"></i>
                </div>
                <div class="step-name">${index + 1}. ${step.name}</div>
            </div>
            ${step.time ? `<div class="step-time">${step.time}</div>` : ''}
            ${step.log_message ? `<div class="step-log">${step.log_message}</div>` : ''}
            ${step.error_message ? `<div class="step-log"style="color: #dc3545;">${step.error_message}</div>` : ''}
        </div>
    `;
}

// 仓库地址缓存：taskId -> 字符串；空串表示已尝试但暂未生成
const repoUrlCache = {};
// 正在拉取中的任务，避免轮询时重复请求
const repoUrlFetching = {};
// Shuttle 构建进度缓存：taskId -> {found, state_label, build_state, jobs, shuttle_task_id, ts}
const shuttleCache = {};
// 正在拉取 Shuttle 进度的任务，避免轮询时重复请求
const shuttleFetching = {};

// 创建打包信息区块（CRP打包得到的子仓库地址、包版本号、包hash等）
function createBuildInfoSection(task) {
    // 仅涉及 CRP 打包的模式展示
    if (task.mode !== 'normal' && task.mode !== 'crp_only') {
        return '';
    }
    const branch = task.crp_branch_name || '-';
    const topic = task.crp_topic_name || (task.crp_topic_id ? `主题#${task.crp_topic_id}` : '-');
    const crpUrl = task.crp_build_url || '-';
    const version = task.version || '-';
    const pkgHash = task.crp_commit_hash || '-';
    // 仓库地址需在 CRP 构建完成后按需拉取，这里先给占位
    let repoText = '-';
    if (repoUrlCache[task.id] !== undefined) {
        repoText = repoUrlCache[task.id] || '暂未生成（构建可能未完成）';
    } else if (task.crp_topic_id) {
        repoText = '获取中...';
    }
    return `
        <div class="build-info">
            <div class="build-info-title">
                <span><i class="bi bi-info-circle-fill"></i> 打包信息</span>
                ${task.crp_topic_id ? `<button class="btn-refresh-repo" onclick="fetchRepoUrl(${task.id}, true)" title="刷新仓库地址"><i class="bi bi-arrow-clockwise"></i></button>` : ''}
            </div>
            <div class="build-info-content">
                <div>打包分支：${escapeHtml(branch)}</div>
                <div>主题：${escapeHtml(topic)}</div>
                <div>CRP地址：${escapeHtml(crpUrl)}</div>
                <div>仓库地址：<span id="repo-url-${task.id}" class="repo-url-value">${escapeHtml(repoText)}</span></div>
                <div>包版本号：${escapeHtml(version)}</div>
                <div>包hash：${escapeHtml(pkgHash)}</div>
                ${task.crp_topic_id ? `<div>工作流：<a href="https://crp.uniontech.com/#/workflow/workflow?id=${task.crp_topic_id}" target="_blank" class="text-decoration-none" title="跳转到 CRP 工作流">查看工作流 <i class="bi bi-box-arrow-up-right"></i></a></div>` : ''}
            </div>
            <div class="shuttle-block">
                <div class="shuttle-block-title">
                    <span><i class="bi bi-hdd-network-fill"></i> Shuttle 构建</span>
                    <span id="shuttle-state-${task.id}" class="shuttle-state-text">-</span>
                </div>
                <div id="shuttle-jobs-${task.id}" class="shuttle-jobs">获取中...</div>
                <div id="shuttle-link-${task.id}" class="shuttle-link"></div>
            </div>
        </div>
    `;
}

// 设置仓库地址文本
function setRepoUrlText(taskId, text) {
    const el = document.getElementById(`repo-url-${taskId}`);
    if (el) el.textContent = text;
}

// 渲染后按需拉取仓库地址（每个任务每个页面会话只自动拉取一次）
function ensureRepoUrl(task) {
    if (task.mode !== 'normal' && task.mode !== 'crp_only') return;
    if (!task.crp_topic_id) return;
    if (repoUrlCache[task.id] !== undefined) {
        setRepoUrlText(task.id, repoUrlCache[task.id] || '暂未生成（构建可能未完成）');
        return;
    }
    if (repoUrlFetching[task.id]) return; // 已有请求在途，避免轮询重复拉取
    setRepoUrlText(task.id, '获取中...');
    fetchRepoUrl(task.id, false);
}

// 拉取仓库地址并更新对应任务卡片
async function fetchRepoUrl(taskId, force) {
    if (force) delete repoUrlCache[taskId];
    if (repoUrlCache[taskId] !== undefined) {
        setRepoUrlText(taskId, repoUrlCache[taskId] || '暂未生成（构建可能未完成）');
        return;
    }
    repoUrlFetching[taskId] = true;
    setRepoUrlText(taskId, '获取中...');
    try {
        const response = await fetch(`/api/tasks/${taskId}/repo-url`);
        const result = await response.json();
        if (result.success && result.data && result.data.repo_urls && result.data.repo_urls.length) {
            const text = result.data.repo_urls.join('\n');
            repoUrlCache[taskId] = text;
            setRepoUrlText(taskId, text);
        } else {
            repoUrlCache[taskId] = '';
            setRepoUrlText(taskId, '暂未生成（构建可能未完成）');
        }
    } catch (err) {
        setRepoUrlText(taskId, '获取失败');
    } finally {
        repoUrlFetching[taskId] = false;
    }
}
// 渲染后按需拉取 Shuttle 构建进度（仅 CRP 打包模式）
function ensureShuttleStatus(task) {
    if (task.mode !== 'normal' && task.mode !== 'crp_only') return;
    if (!task.crp_topic_id) return;
    // 先用缓存立即渲染，避免 5s 轮询重建卡片时闪烁
    renderShuttleStatus(task);
    const terminal = ['success', 'failed', 'cancelled'].includes(task.status);
    const now = Date.now();
    // 已完成且已有缓存则不再刷新；否则后台拉取（节流 8s）
    if (terminal && shuttleCache[task.id]) return;
    if (shuttleFetching[task.id]) return;
    const last = shuttleCache[task.id] ? shuttleCache[task.id].ts : 0;
    if (now - last < 8000) return;
    fetchShuttleStatus(task);
}

// 拉取 Shuttle 构建进度：先经后端解析 CRP release 得到 Shuttle 任务 ID，再直接查 Shuttle 各架构 job
async function fetchShuttleStatus(task) {
    shuttleFetching[task.id] = true;
    try {
        const resp = await fetch(`/api/tasks/${task.id}/shuttle-status`);
        const result = await resp.json();
        if (!result.success || !result.data) { shuttleFetching[task.id] = false; return; }
        const d = result.data;
        let jobs = [];
        if (d.shuttle_task_id) {
            try {
                const sresp = await fetch('https://shuttle.uniontech.com/api/shuttle/task/list', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ params: { taskid: String(d.shuttle_task_id) }, pageSize: 50, current: 1 })
                });
                const sdata = await sresp.json();
                const stasks = sdata.tasks || [];
                if (stasks.length && stasks[0].jobs) jobs = stasks[0].jobs;
            } catch (e) { /* Shuttle 查询失败时仅展示 CRP 状态 */ }
        }
        shuttleCache[task.id] = {
            found: d.found,
            state_label: d.build_state_label || '未知',
            build_state: d.build_state,
            jobs: jobs,
            shuttle_task_id: d.shuttle_task_id || 0,
            ts: Date.now()
        };
        renderShuttleStatus(task);
    } catch (e) { /* 忽略，下次轮询重试 */ }
    finally { shuttleFetching[task.id] = false; }
}

// 渲染 Shuttle 构建进度（状态文案 + 各架构徽标 + 跳转入口）
function renderShuttleStatus(task) {
    const stateEl = document.getElementById(`shuttle-state-${task.id}`);
    const jobsEl = document.getElementById(`shuttle-jobs-${task.id}`);
    const linkEl = document.getElementById(`shuttle-link-${task.id}`);
    if (!stateEl || !jobsEl || !linkEl) return;
    const c = shuttleCache[task.id];
    if (!c) {
        stateEl.textContent = '等待中…';
        jobsEl.innerHTML = '<span class="text-muted small">等待 Shuttle 任务创建…</span>';
        linkEl.innerHTML = '';
        return;
    }
    stateEl.textContent = c.state_label;
    if (c.jobs && c.jobs.length) {
        jobsEl.innerHTML = c.jobs.map(j => {
            const st = (j.status || 'UNKNOWN').toUpperCase();
            let cls = 'shuttle-job-other';
            if (st === 'UPLOAD_OK') cls = 'shuttle-job-ok';
            else if (st === 'FAILED') cls = 'shuttle-job-failed';
            else if (st === 'BUILD_OK') cls = 'shuttle-job-builtinok';
            else if (st.includes('BUILD') || st.includes('UPLOAD') || st.includes('APPLY')) cls = 'shuttle-job-building';
            const url = `https://shuttle.uniontech.com/#/details/build?jobId=${j.id}`;
            return `<a href="${url}" target="_blank" class="shuttle-job-badge ${cls}" title="${st}">${escapeHtml(j.arch || '')} · ${st}</a>`;
        }).join('');
        const first = c.jobs[0];
        linkEl.innerHTML = `<a href="https://shuttle.uniontech.com/#/details/build?jobId=${first.id}" target="_blank" class="btn btn-sm btn-outline-primary"><i class="bi bi-box-arrow-up-right"></i> 查看 Shuttle 构建</a>`;
    } else if (c.shuttle_task_id) {
        jobsEl.innerHTML = '<span class="text-muted small">暂无架构构建信息</span>';
        linkEl.innerHTML = `<a href="https://shuttle.uniontech.com/" target="_blank" class="btn btn-sm btn-outline-primary"><i class="bi bi-box-arrow-up-right"></i> 前往 Shuttle</a>`;
    } else {
        jobsEl.innerHTML = '<span class="text-muted small">等待 Shuttle 任务创建…</span>';
        linkEl.innerHTML = '';
    }
}

// 创建操作按钮
function createActionButtons(task) {
    const buttons = [];
    
    // 根据任务状态显示不同按钮
    if (task.status === 'running') {
        buttons.push(`
            <button class="btn btn-sm btn-warning" onclick="pauseTask(${task.id})">
                <i class="bi bi-pause-fill"></i> 暂停
            </button>
        `);
    } else if (task.status === 'paused') {
        buttons.push(`
            <button class="btn btn-sm btn-success" onclick="resumeTask(${task.id})">
                <i class="bi bi-play-fill"></i> 继续
            </button>
        `);
        buttons.push(`
            <button class="btn btn-sm btn-primary" onclick="retryTask(${task.id})">
                <i class="bi bi-arrow-clockwise"></i> 重试
            </button>
        `);
    } else if (task.status === 'failed' || task.status === 'cancelled') {
        // 失败或取消的任务显示重试和重新开始按钮
        buttons.push(`
            <button class="btn btn-sm btn-warning" onclick="retryTask(${task.id})">
                <i class="bi bi-arrow-clockwise"></i> 重试当前步骤
            </button>
        `);
        buttons.push(`
            <button class="btn btn-sm btn-primary" onclick="restartTask(${task.id})">
                <i class="bi bi-arrow-repeat"></i> 重新开始
            </button>
        `);
    }
    
    // 通用按钮
    buttons.push(`
        <button class="btn btn-sm btn-outline-secondary" onclick="viewTaskDetail(${task.id})">
            <i class="bi bi-eye"></i> 详情
        </button>
    `);
    
    if (task.status !== 'success' && task.status !== 'cancelled') {
        buttons.push(`
            <button class="btn btn-sm btn-outline-danger" onclick="cancelTask(${task.id})">
                <i class="bi bi-x-circle"></i> 取消
            </button>
        `);
    }
    
    // 删除按钮 - 运行中的任务不可删除
    if (task.status === 'running') {
        buttons.push(`
            <button class="btn btn-sm btn-outline-danger" disabled title="运行中的任务不能删除">
                <i class="bi bi-trash"></i> 删除
            </button>
        `);
    } else {
        buttons.push(`
            <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(${task.id})">
                <i class="bi bi-trash"></i> 删除
            </button>
        `);
    }
    
    return buttons.join('');
}

// 刷新任务列表
function refreshTasks() {
    loadTasks();
}

// 筛选任务
function filterTasks(status) {
    currentFilter = status;
    
    // 更新按钮状态
    document.querySelectorAll('.btn-group .btn').forEach(btn => {
        btn.classList.remove('active');
    });
    event.target.classList.add('active');
    
    loadTasks();
}

// 查看任务详情
function viewTaskDetail(taskId) {
    // TODO: 显示详细模态框
    alert(`查看任务 #${taskId} 详情\n（功能待实现）`);
}

// 重试任务（从失败步骤继续）
async function retryTask(taskId) {
    // 获取任务数据以确定失败步骤
    const task = currentTasks.find(t => t.id === taskId);
    const failedStep = task ? task.current_step : null;
    
    const stepInfo = failedStep !== null ? `从步骤 ${failedStep} 继续执行` : `继续执行`;
    const confirmed = await customConfirm(
        `将${stepInfo}，失败的步骤会被重新执行。`,
        `重试任务 #${taskId}`,
        'arrow-repeat',
        'primary'
    );
    
    if (confirmed) {
        // 从失败的步骤继续（传递当前步骤号）
        const url = failedStep !== null 
            ? `/api/tasks/${taskId}/retry?from_step=${failedStep}`
            : `/api/tasks/${taskId}/retry`;
            
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => {
                    throw new Error(err.error || '重试失败');
                });
            }
            return response.json();

// 显示未合并的PR列表
async function showUnmergedPRs() {
    const modal = new bootstrap.Modal(document.getElementById('unmergedPRModal'));
    modal.show();
    
    // 显示加载状态
    document.getElementById('prLoadingSpinner').style.display = 'block';
    document.getElementById('prListContainer').style.display = 'none';
    document.getElementById('prEmptyState').style.display = 'none';
    
    try {
        const response = await fetch('/api/tasks/unmerged-prs');
        const data = await response.json();
        
        if (!data.success) {
            throw new Error(data.message || '获取PR列表失败');
        }
        
        // 隐藏加载状态
        document.getElementById('prLoadingSpinner').style.display = 'none';
        
        if (data.data && data.data.length > 0) {
            // 显示PR列表
            renderPRList(data.data);
            document.getElementById('prListContainer').style.display = 'block';
        } else {
            // 显示空状态
            document.getElementById('prEmptyState').style.display = 'block';
        }
    } catch (error) {
        console.error('获取PR列表失败:', error);
        document.getElementById('prLoadingSpinner').style.display = 'none';
        document.getElementById('prListContainer').innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle"></i>
                获取PR列表失败：${error.message}
            </div>
        `;
        document.getElementById('prListContainer').style.display = 'block';
    }
}

// 渲染PR列表
function renderPRList(prList) {
    const container = document.getElementById('prListContainer');
    let html = '<div class="pr-list">';
    
    prList.forEach((pr, index) => {
        html += `
            <div class="pr-item" style="animation-delay: ${index * 0.05}s">
                <div class="pr-header">
                    <div>
                        <h6 class="pr-title">${escapeHtml(pr.project_name)}</h6>
                        <span class="pr-number">#${pr.pr_number}</span>
                    </div>
                </div>
                <div class="pr-meta">
                    <div class="pr-meta-item">
                        <i class="bi bi-box"></i>
                        <span>版本: ${escapeHtml(pr.version)}</span>
                    </div>
                    <div class="pr-meta-item">
                        <i class="bi bi-clock"></i>
                        <span>${formatDate(pr.created_at)}</span>
                    </div>
                    ${pr.pr_status ? `
                    <div class="pr-meta-item">
                        <span class="pr-status-badge pr-status-${pr.pr_status}">
                            <i class="bi bi-circle-fill"></i>
                            ${pr.pr_status}
                        </span>
                    </div>
                    ` : ''}
                </div>
                <div class="pr-url">
                    <a href="${pr.pr_url}" target="_blank" class="pr-link" title="${pr.pr_url}">
                        ${pr.pr_url}
                    </a>
                    <button class="btn-copy-pr" onclick="copySinglePR('${pr.pr_url}', this)">
                        <i class="bi bi-clipboard"></i> 复制
                    </button>
                </div>
            </div>
        `;
    });
    
    html += '</div>';
    container.innerHTML = html;
}

// 复制单个PR链接
async function copySinglePR(url, button) {
    try {
        await copyToClipboard(url);
        const originalHTML = button.innerHTML;
        button.innerHTML = '<i class="bi bi-check"></i> 已复制';
        button.classList.add('copied');
        
        setTimeout(() => {
            button.innerHTML = originalHTML;
            button.classList.remove('copied');
        }, 2000);
    } catch (err) {
        console.error('复制失败:', err);
        showToast('复制失败', 'error');
    }
}

// 一键复制所有PR链接
async function copyAllPRs() {
    try {
        const response = await fetch('/api/tasks/unmerged-prs');
        const data = await response.json();
        
        if (!data.success || !data.data || data.data.length === 0) {
            showToast('没有可复制的PR', 'warning');
            return;
        }
        
        // 生成格式化的文本
        const prText = data.data.map(pr => {
            return `【${pr.project_name}】 v${pr.version} - #${pr.pr_number}\n${pr.pr_url}`;
        }).join('\n\n');
        
        await copyToClipboard(prText);
        
        // 显示复制成功的反馈
        const feedback = document.querySelector('.copy-feedback');
        feedback.textContent = `✓ 已复制 ${data.data.length} 个 PR 链接`;
        feedback.style.opacity = '1';
        
        setTimeout(() => {
            feedback.style.opacity = '0';
        }, 2500);
        
        showToast(`已复制 ${data.data.length} 个 PR 链接到剪贴板`, 'success');
        
    } catch (error) {
        console.error('复制失败:', error);
        showToast('复制失败：' + error.message, 'error');
    }
}

// HTML转义函数
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// 格式化日期
function formatDate(dateString) {
    if (!dateString) return '';
    const date = new Date(dateString);
    const now = new Date();
    const diff = now - date;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor(diff / (1000 * 60));
    
    if (days > 0) return `${days}天前`;
    if (hours > 0) return `${hours}小时前`;
    if (minutes > 0) return `${minutes}分钟前`;
    return '刚刚';
}
